<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · __EVENT__ · Medscape</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Página de erro do Apache (ErrorDocument 404). Autocontida: pode ser servida em qualquer caminho. -->
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #e8f5fb;
      color: #054aa7;
    }
    .card {
      max-width: 420px;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(5, 74, 167, .12);
    }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      color: #156082;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; margin: 0 0 12px; }
    p { font-size: 14px; line-height: 1.5; color: #747474; margin: 0 0 24px; }
    a {
      display: inline-block;
      background: #054aa7;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 4px;
    }
    a:hover { background: #156082; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">ERRO 404</span>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi alterado. Confira o link ou volte para o início.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
