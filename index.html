<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#054aa7" />
    <title>__EVENT__ · Medscape</title>
    <meta name="description" content="Análises e perspectivas de especialistas sobre os principais estudos, avanços científicos e atualizações do congresso." />

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Prévia ao compartilhar o link (WhatsApp, LinkedIn, e-mail...).
         __SITE_URL__ vira o endereço público no build: SITE_URL=https://.../ npm run build -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Medscape" />
    <meta property="og:title" content="__EVENT__ · Medscape" />
    <meta property="og:description" content="Análises e perspectivas de especialistas sobre os principais estudos, avanços científicos e atualizações do congresso." />
    <meta property="og:url" content="__SITE_URL__" />
    <!-- Imagem de compartilhamento (1200 × 630): salvar em public/og-image.jpg e trocar o "summary" abaixo por
         "summary_large_image", incluindo:
         <meta property="og:image" content="__SITE_URL__og-image.jpg" /> -->
    <meta name="twitter:card" content="summary" />
    <!-- Sem login (padrão: npm run dev / npm run build) esta página carrega o app direto.
         Com login (npm run build:login), vira a tela de cadastro/login (src/gate/) e o app fica em
         home.html, entregue pelo index.php só com sessão. -->
  </head>
  <body id="topo">
    <div id="root"></div>
    <script type="module" src="/src/gate/main.jsx"></script>
  </body>
</html>
